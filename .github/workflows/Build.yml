
name: Build Survival Mod Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SurvivalModLauncher-OnlineBuild.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o SurvivalModLauncher-OnlineBuild.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project
          DIR=$(find . -name gradlew -type f | head -1)
          if [ -z "$DIR" ]; then
            echo "Gradle wrapper tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalModLauncher-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
