
name: Build Survival Mod Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SurvivalModLauncher-OnlineBuild.zip'
      - '.github/workflows/Build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o SurvivalModLauncher-OnlineBuild.zip -d project

      - name: Build APK
        run: |
          FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$FILE" ]; then
            echo "File settings.gradle tidak ditemukan dalam ZIP"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalModLauncher-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
